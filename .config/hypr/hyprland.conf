# ==============================================================================
# MINIMALIST VINTAGE / CLASSIC RETRO HYPRLAND CONFIGURATION
# Location: ~/.config/hypr/hyprland.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MONITORS & ENVIRONMENT
# ------------------------------------------------------------------------------
# Monitor Setup: Laptop (eDP-1) on Left, Philips 27" 120Hz (HDMI-A-1) on Right
monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@120, 1920x0, 1
monitor = , preferred, auto, 1

# Bind Workspaces: 1-5 to Laptop eDP-1, 6-10 to HDMI-A-1
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11

# ------------------------------------------------------------------------------
# 2. AUTOSTART
# ------------------------------------------------------------------------------
exec-once = bash ~/.config/hypr/fix-socket.sh
exec-once = bash ~/.config/hypr/power-daemon.sh &
exec-once = waybar &
exec-once = swaybg -m fill -i ~/Pictures/Wallpapers/wallpaper.png &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ------------------------------------------------------------------------------
# 3. LOOK & FEEL (MINIMALIST CLASSIC OLD-STYLE)
# ------------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1

    # Classic Vintage Monochrome Borders (Crisp Light Grey & Charcoal)
    col.active_border = rgba(ccccccff)
    col.inactive_border = rgba(333333aa)

    layout = dwindle
    resize_on_border = true
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = false
}

render {
    direct_scanout = false
}

decoration {
    rounding = 0 # Classic sharp vintage box edges

    active_opacity = 0.98
    inactive_opacity = 0.92

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# ------------------------------------------------------------------------------
# 4. FAST SNAPPY ANIMATIONS
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = classicSnap, 0, 1, 0.5, 1

    animation = windows, 1, 2, classicSnap
    animation = windowsOut, 1, 2, classicSnap
    animation = windowsMove, 1, 2, classicSnap
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, classicSnap, slide
}

# ------------------------------------------------------------------------------
# 5. INPUT & MISC
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8
        tap-to-click = true
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ------------------------------------------------------------------------------
# 6. KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

$terminal = foot
$menu = ~/.config/hypr/toggle-wofi.sh
$fileManager = thunar
$lockScreen = /usr/bin/swaylock -c 121212 --font "JetBrainsMono Nerd Font" --ring-color cccccc --key-hl-color ffffff --line-color 333333 --inside-color 181818ff --indicator-radius 80 --indicator-thickness 4

# Open & Close App Launcher on SUPER Key Press/Release (Toggle)
bindr = SUPER, SUPER_L, exec, $menu

# Core Binds
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, $lockScreen
bind = $mainMod, M, exit,

# Screenshot
bind = , Print, exec, FILE=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && mkdir -p ~/Pictures/Screenshots && grim $FILE && notify-send -i image "Screenshot" "Full screen saved" -t 2000
bind = SHIFT, Print, exec, FILE=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" $FILE && notify-send -i image "Screenshot" "Region saved" -t 2000
bind = $mainMod, Print, exec, grim - | wl-copy && notify-send -i image "Screenshot" "Copied to clipboard" -t 2000
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send -i image "Screenshot" "Region copied to clipboard" -t 2000

# Volume & Brightness Keys
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = $mainMod, F6, exec, brightnessctl set +5%
binde = $mainMod, F5, exec, brightnessctl set 5%-

# Focus Navigation & Monitor Switch
bind = $mainMod, TAB, focusmonitor, +1
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Binds
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
