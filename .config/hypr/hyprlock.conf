# ==============================================================================
# MINIMALIST VINTAGE RETRO HYPRLOCK CONFIGURATION
# Location: ~/.config/hypr/hyprlock.conf
# ==============================================================================

background {
    monitor =
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 0
}

# RETRO SYSTEM HEADER
label {
    monitor =
    text = [ SYSTEM LOCKED ]
    color = rgba(204, 204, 204, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# RETRO CENTER DIGITAL CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "[ $(date +"%H:%M:%S") ]"
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# RETRO DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(150, 150, 150, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

# RETRO CENTERED PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(204, 204, 204, 0.8)
    inner_color = rgba(24, 24, 24, 1.0)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false

    placeholder_text = <span foreground="##888888">[ ENTER PASSWORD ]</span>
    hide_input = false
    rounding = 0

    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(255, 100, 100, 1.0)
    fail_text = <span foreground="##ff6464">[ ACCESS DENIED ]</span>

    position = 0, -60
    halign = center
    valign = center
}
