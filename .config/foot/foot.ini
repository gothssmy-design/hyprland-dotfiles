# ==============================================================================
# FOOT TERMINAL — TOKYO NIGHT ELEGANT DARK THEME
# ~/.config/foot/foot.ini
# ==============================================================================

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=14
dpi-aware=no
pad=12x8
notify=off

[scrollback]
lines=10000

[cursor]
style=block
color=1a1b26 7dcfff
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
background=1a1b26
foreground=a9b1d6

# Selection
selection-foreground=c0caf5
selection-background=33467c

# Normal colors
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# Bright colors
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+equal
font-decrease=Control+minus
search-start=Control+Shift+r
